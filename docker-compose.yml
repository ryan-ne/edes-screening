services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      REQUIRE_AUTH: "true"     # refuse to start without APP_PASSWORD
      COOKIE_SECURE: "true"    # cookies only over HTTPS
      DB_PATH: /app/data/screening.db
    volumes:
      - app_data:/app/data
    # No published ports: only reachable through Caddy.

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  app_data:
  caddy_data:
  caddy_config:
